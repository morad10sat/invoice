<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORADSAT - beIN SPORTS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: auto; }
        .card { background: white; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; border-top: 8px solid #49006a; text-align: center; }
        .moradsat-title { color: #49006a; font-size: 32px; font-weight: bold; margin: 0; }
        .site-url { color: #49006a; font-size: 18px; font-weight: bold; margin: 5px 0; display: block; }
        .bein-logo { margin: 15px 0 5px 0; font-style: italic; font-size: 28px; color: #49006a; font-weight: bold; }
        .bein-box { background: #49006a; color: white; padding: 4px 12px; border-radius: 8px; font-weight: bold; margin-left: 5px; }
        .contact-number { color: #d32f2f; font-weight: bold; font-size: 20px; margin-bottom: 15px; display: block; }

        .admin-section { border: 2px solid #49006a; padding: 15px; border-radius: 20px; margin-bottom: 20px; background: #fff; }
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .btn-confirm { background: #2ecc71; color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        #invoice-result { display: none; background: white; border-radius: 20px; padding: 25px; margin-top: 20px; border: 2px solid #49006a; text-align: left; }
        .price-total { text-align: center; font-size: 30px; font-weight: bold; color: #d32f2f; margin: 15px 0; border-top: 1px solid #fee; padding-top: 10px; }
        
        .payment-container { margin-top: 20px; }
        .payment-box { padding: 15px; border-radius: 15px; margin-bottom: 15px; text-align: center; border: 2px dashed; }
        .cashplus-box { background: #fff9e6; border-color: #ff8c00; } 
        .bank-box { background: #e6f4ea; border-color: #006b33; } 
        .payment-title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 8px; }
        .account-num { font-family: monospace; font-size: 18px; color: #d32f2f; font-weight: bold; background: rgba(255,255,255,0.7); padding: 5px; border-radius: 5px; display: inline-block; word-break: break-all; }

        .check-section { background: #eef7ff; border: 2px solid #3498db; border-radius: 18px; padding: 15px; margin: 20px 0; }
        .btn-check { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #check-display { display: none; margin-top: 10px; padding: 15px; background: white; border-radius: 10px; border: 1px dashed #3498db; font-size: 15px; text-align: left; }
        .status-badge { padding: 4px 10px; border-radius: 6px; color: white; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .btn-renew { background: #ff8c00; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="moradsat-title">MORADSAT</div>
        <div class="site-url">morad10sat.github.io</div>
        <div class="bein-logo">beIN <span class="bein-box">SPORTS</span></div>
        <span class="contact-number">Tél: 0638485812</span>

        <div class="admin-section">
            <input type="password" id="adminPass" style="border: 2px solid #e74c3c; background: #fff5f5; text-align:center;" placeholder="كود الإدارة السري">
            <input type="text" id="custName" placeholder="Nom du Client">
            <input type="number" id="custPhone" placeholder="Téléphone">
            <input type="text" id="custCard" placeholder="Numéro Smart Card">
            <select id="duration">
                <optgroup label="💎 ULTIMATE">
                    <option value="350" data-months="1" data-plan="ULTIMATE - 1 Month">ULTIMATE - 1 Month (350 DH)</option>
                    <option value="700" data-months="2" data-plan="ULTIMATE - 2 Months">ULTIMATE - 2 Months (700 DH)</option>
                    <option value="1000" data-months="3" data-plan="ULTIMATE - 3 Months">ULTIMATE - 3 Months (1000 DH)</option>
                </optgroup>
                <optgroup label="🌟 PREMIUM">
                    <option value="190" data-months="1" data-plan="PREMIUM - 1 Month">PREMIUM - 1 Month (190 DH)</option>
                    <option value="470" data-months="3" data-plan="PREMIUM - 3 Months">PREMIUM - 3 Months (470 DH)</option>
                </optgroup>
                <optgroup label="➕ Add Ons">
                    <option value="950" data-months="24" data-plan="FIFA World Cup 2026">FIFA World Cup 2026 (950 DH)</option>
                    <option value="450" data-months="24" data-plan="AFC Asian Cup Saudi 2027">AFC Asian Cup Saudi Arabia 2027 (450 DH)</option>
                </optgroup>
            </select>
            <button class="btn-confirm" onclick="generateInvoice()">✅ CONFIRMER & ENVOYER</button>
        </div>

        <div class="check-section">
            <input type="text" id="checkInput" placeholder="فحص البطاقة">
            <button class="btn-check" onclick="runCheck()">Vérifier</button>
            <div id="check-display">
                <center><span id="statusLabel" class="status-badge">---</span></center>
                <b>Client:</b> <span id="chkName"></span><br>
                <b>Tél:</b> <span id="chkPhone"></span><br>
                <b>Début:</b> <span id="chkStart"></span><br>
                <b>Fin:</b> <span id="chkEnd"></span>
                <button class="btn-renew" id="renewBtn">🔄 RENOUVELER CETTE CARTE</button>
            </div>
        </div>
    </div>

    <div id="invoice-result">
        <center><div class="moradsat-title">MORADSAT</div></center>
        <div style="margin-top: 15px; font-size: 17px; line-height: 1.6;">
            <b>Offre:</b> <span id="resPlan"></span><br>
            <b>Client:</b> <span id="resName"></span><br>
            <b>Card:</b> <span id="resCard"></span><br>
            <b>Début:</b> <span id="resStart"></span><br>
            <b>Fin:</b> <span id="resEnd"></span>
            <div class="price-total" id="resPrice"></div>
        </div>
        
        <div class="payment-container">
            <div class="payment-box cashplus-box">
                <span class="payment-title" style="color: #006b33;">💰 CASH PLUS</span>
                <div class="account-num">35553R2778</div>
            </div>
            <div class="payment-box bank-box">
                <span class="payment-title" style="color: #006b33;">🏦 SAHAM BANK (Mourad)</span>
                <div class="account-num">022 270 0003 4500 2773 6638 68</div>
            </div>
            <center><small style="color: gray;">يرجى إرسال التوصيل بعد الأداء</small></center>
        </div>
    </div>
</div>

<script>
    const databaseURL = "https://moradsat-db-default-rtdb.firebaseio.com/";
    const SECRET_KEY = "mohra"; 

    function calculateExpiry(months) {
        const start = new Date();
        const end = new Date();
        end.setMonth(start.getMonth() + parseInt(months));
        return { startStr: start.toLocaleDateString('fr-FR'), endStr: end.toLocaleDateString('fr-FR'), expiryTimestamp: end.getTime() };
    }

    async function generateInvoice() {
        const pass = document.getElementById('adminPass').value;
        if(pass !== SECRET_KEY) { alert("الكود السري خطأ!"); return; }
        const n = document.getElementById('custName').value;
        const ph = document.getElementById('custPhone').value;
        const c = document.getElementById('custCard').value;
        const sel = document.getElementById('duration');
        const p = sel.value;
        const plan = sel.options[sel.selectedIndex].getAttribute('data-plan');
        const months = sel.options[sel.selectedIndex].getAttribute('data-months');
        if(!n || !c) { alert("المرجو إدخال المعلومات!"); return; }
        const dt = calculateExpiry(months);
        const clientData = { name: n, phone: ph, plan: plan, start: dt.startStr, end: dt.endStr, expiryTimestamp: dt.expiryTimestamp };
        try {
            await fetch(`${databaseURL}/clients/${c}.json`, { method: 'PUT', body: JSON.stringify(clientData) });
            document.getElementById('resPlan').innerText = plan;
            document.getElementById('resName').innerText = n;
            document.getElementById('resCard').innerText = c;
            document.getElementById('resStart').innerText = dt.startStr;
            document.getElementById('resEnd').innerText = dt.endStr;
            document.getElementById('resPrice').innerText = p + " DH";
            document.getElementById('invoice-result').style.display = 'block';
            const msg = encodeURIComponent(`*MORADSAT*\n*Offre:* ${plan}\n*Card:* ${c}\n*Début:* ${dt.startStr}\n*Fin:* ${dt.endStr}\n*Prix:* ${p} DH\n\n*Payment:*\n- CashPlus: 35553R2778\n- Saham Bank: 022 270 0003 4500 2773 6638 68`);
            window.open(`https://wa.me/212638485812?text=${msg}`, '_blank');
        } catch (e) { alert("خطأ!"); }
    }

    async function runCheck() {
        const inputVal = document.getElementById('checkInput').value;
        const display = document.getElementById('check-display');
        const statusLabel = document.getElementById('statusLabel');
        if(!inputVal) return;
        try {
            const response = await fetch(`${databaseURL}/clients/${inputVal}.json`);
            const data = await response.json();
            if(data) {
                document.getElementById('chkName').innerText = data.name;
                document.getElementById('chkPhone').innerText = data.phone || "---";
                document.getElementById('chkStart').innerText = data.start || "---";
                document.getElementById('chkEnd').innerText = data.end;
                
                const now = new Date().getTime();
                const expiry = data.expiryTimestamp || 0;
                const diffDays = (expiry - now) / (1000 * 60 * 60 * 24);

                if (diffDays < 0) {
                    statusLabel.innerText = "Expiré ❌";
                    statusLabel.style.background = "#e74c3c";
                } else if (diffDays <= 7) {
                    statusLabel.innerText = "Bientôt expiré ⚠️";
                    statusLabel.style.background = "#f1c40f";
                    statusLabel.style.color = "black";
                } else {
                    statusLabel.innerText = "Active ✅";
                    statusLabel.style.background = "#2ecc71";
                    statusLabel.style.color = "white";
                }
                display.style.display = 'block';

                // وظيفة زر التجديد
                document.getElementById('renewBtn').onclick = function() {
                    document.getElementById('custName').value = data.name;
                    document.getElementById('custPhone').value = data.phone || "";
                    document.getElementById('custCard').value = inputVal;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
            } else { alert("غير موجود!"); }
        } catch (e) { alert("خطأ!"); }
    }
</script>
</body>
</html>
