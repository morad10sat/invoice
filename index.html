<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORADSAT - beIN SPORTS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: auto; }
        .card { background: white; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 25px; border-top: 8px solid #49006a; text-align: center; }
        .moradsat-title { color: #49006a; font-size: 32px; font-weight: bold; margin: 0; }
        .site-url { color: #49006a; font-size: 18px; font-weight: bold; margin: 5px 0; display: block; }
        .my-phone-header { color: #000; font-size: 22px; font-weight: bold; margin-bottom: 5px; display: block; }
        .bein-logo { margin: 15px 0; font-style: italic; font-size: 28px; color: #49006a; font-weight: bold; }
        .bein-box { background: #49006a; color: white; padding: 4px 12px; border-radius: 8px; font-weight: bold; margin-left: 5px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .btn-confirm { background: #2ecc71; color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .check-section { background: #eef7ff; border: 2px solid #3498db; border-radius: 18px; padding: 15px; margin: 20px 0; }
        .btn-check { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #check-display { display: none; margin-top: 10px; padding: 15px; background: white; border-radius: 10px; border: 1px dashed #3498db; font-size: 16px; text-align: left; line-height: 1.8; }
        #invoice-result { display: none; background: white; border-radius: 20px; padding: 25px; margin-top: 20px; border: 2px solid #49006a; }
        .dates-box { border: 2px solid #ff4d4d; border-radius: 12px; padding: 15px; margin: 15px 0; background: #fff8f8; text-align: left; }
        .date-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; color: #333; }
        .price-total { text-align: center; font-size: 30px; font-weight: bold; color: #d32f2f; margin-top: 10px; border-top: 1px solid #fee; padding-top: 10px; }
        .cash-plus-footer { background: #008080; border: 3px solid #fbc02d; padding: 15px; margin-top: 15px; border-radius: 15px; color: white; text-align: center; }
        .cp-text { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="moradsat-title">MORADSAT</div>
        <div class="site-url">morad10sat.github.io</div>
        <div class="my-phone-header">06.38.48.58.12</div>
        <div class="bein-logo">beIN <span class="bein-box">SPORTS</span></div>
        
        <input type="text" id="custName" placeholder="Nom du Client">
        <input type="number" id="custPhone" placeholder="Téléphone">
        <input type="text" id="custCard" placeholder="Numéro Smart Card">
        <select id="duration">
            <option value="190" data-months="1">beIN - 1 Mois (190 DH)</option>
            <option value="470" data-months="3">beIN - 3 Mois (470 DH)</option>
            <option value="950" data-months="6">beIN - 6 Mois (950 DH)</option>
            <option value="1800" data-months="12">beIN - 12 Mois (1800 DH)</option>
            <option value="1000" data-months="12">beIN - كاس العالم (1000 DH)</option>
            <option value="200" data-months="12">IPTV - العام (200 DH)</option>
        </select>
        <button class="btn-confirm" onclick="generateInvoice()">✅ CONFIRMER & ENVOYER</button>

        <div class="check-section">
            <div style="color: #2980b9; font-weight: bold; margin-bottom: 10px;">🔍 Vérifier Expiration</div>
            <input type="text" id="checkInput" placeholder="Entrer n° de carte beIN">
            <button class="btn-check" onclick="runCheck()">Check Card</button>
            <div id="check-display">
                <b>Statut:</b> <span style="color: green;">Active ✅</span> <br>
                <b>Client:</b> <span id="chkName"></span> <br>
                <b>Tél:</b> <span id="chkPhone"></span> <br>
                <b>Début:</b> <span id="chkStart"></span> <br>
                <b>Fin:</b> <span id="chkEnd"></span>
            </div>
        </div>
    </div>
    <div id="invoice-result">
        <center>
            <div class="moradsat-title">MORADSAT</div>
            <div class="invoice-phone-big">06.38.48.58.12</div>
        </center>
        <div style="margin-top: 20px; font-size: 18px;">
            <b>Client:</b> <span id="resName"></span><br>
            <b>Tél:</b> <span id="resPhone"></span><br>
            <b>Smart Card:</b> <span id="resCard"></span>
            <div class="dates-box">
                <div class="date-row"><span>Date Début:</span> <span id="resStart"></span></div>
                <div class="date-row"><span>Date d'échéance:</span> <span id="resEnd"></span></div>
                <div class="price-total" id="resPrice"></div>
            </div>
        </div>
        <div class="cash-plus-footer">
            <div class="cp-text">CASH <span>PLUS</span></div>
            <div style="font-size: 26px; font-weight: bold;">TPE: 35553R2778</div>
        </div>
    </div>
</div>

<script>
    const databaseURL = "https://moradsat-db-default-rtdb.firebaseio.com/";

    function calculateExpiry(months) {
        const start = new Date();
        const end = new Date();
        end.setMonth(start.getMonth() + parseInt(months));
        return { startStr: start.toLocaleDateString('fr-FR'), endStr: end.toLocaleDateString('fr-FR') };
    }

    async function generateInvoice() {
        const n = document.getElementById('custName').value;
        const ph = document.getElementById('custPhone').value;
        const c = document.getElementById('custCard').value;
        const p = document.getElementById('duration').value;
        const months = document.getElementById('duration').options[document.getElementById('duration').selectedIndex].getAttribute('data-months');
        
        if(!n || !c || !ph) { alert("Veuillez remplir les informations !"); return; }
        const dt = calculateExpiry(months);

        // حفظ في Firebase
        const clientData = { name: n, phone: ph, start: dt.startStr, end: dt.endStr };
        try {
            await fetch(`${databaseURL}/clients/${c}.json`, { method: 'PUT', body: JSON.stringify(clientData) });
        } catch (e) {}

        document.getElementById('resName').innerText = n;
        document.getElementById('resPhone').innerText = ph;
        document.getElementById('resCard').innerText = c;
        document.getElementById('resStart').innerText = dt.startStr;
        document.getElementById('resEnd').innerText = dt.endStr;
        document.getElementById('resPrice').innerText = p + " DH";
        document.getElementById('invoice-result').style.display = 'block';
        window.open(`https://wa.me/212638485812?text=*MORADSAT*%0A*Client:* ${n}%0A*Card:* ${c}%0A*Fin:* ${dt.endStr}`, '_blank');
    }

    async function runCheck() {
        const inputVal = document.getElementById('checkInput').value;
        const display = document.getElementById('check-display');
        if(!inputVal) return;

        try {
            const response = await fetch(`${databaseURL}/clients/${inputVal}.json`);
            const data = await response.json();
            if(data) {
                document.getElementById('chkName').innerText = data.name;
                document.getElementById('chkPhone').innerText = data.phone;
                document.getElementById('chkStart').innerText = data.start;
                document.getElementById('chkEnd').innerText = data.end;
                display.style.display = 'block';
            } else {
                alert("Aucune facture trouvée !");
                display.style.display = 'none';
            }
        } catch (e) { alert("Erreur de connexion !"); }
    }
</script>
</body>
</html>
