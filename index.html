<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moradsat - خدمة التحقق من الاشتراك</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; color: #1a73e8; margin-bottom: 20px; }
        h2 { color: #333; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 1.5rem; text-align: right; line-height: 1.6; }
        .success-box { background: #e7f3fe; padding: 15px; border-radius: 8px; border-right: 5px solid #2196F3; }
        .error-text { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">MORADSAT</div>
    <h2>تتبع اشتراكك</h2>
    <input type="text" id="phoneInput" placeholder="أدخل رقم البطاقة أو الهاتف">
    <button onclick="checkStatus()">تحقق الآن</button>
    <div id="result"></div>
</div>

<script>
    // الرابط اللي صاوبنا دابا في Firebase
    const databaseURL = "https://moradsat-db-default-rtdb.firebaseio.com/";

    async function checkStatus() {
        const phone = document.getElementById('phoneInput').value.trim();
        const resultDiv = document.getElementById('result');
        
        if (!phone) {
            resultDiv.innerHTML = "<p class='error-text'>يرجى إدخال الرقم أولاً!</p>";
            return;
        }

        resultDiv.innerHTML = "<p>جاري البحث...</p>";

        try {
            // جلب البيانات مباشرة من Firebase
            const response = await fetch(`${databaseURL}/clients/${phone}.json`);
            const data = await response.json();

            if (data) {
                resultDiv.innerHTML = `
                    <div class="success-box">
                        <p><strong>الاسم:</strong> ${data.name || '---'}</p>
                        <p><strong>تاريخ الانتهاء:</strong> ${data.expiryDate || '---'}</p>
                        <p><strong>الحالة:</strong> <span style="color: green;">نشط ✅</span></p>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = "<p class='error-text'>❌ عذراً، الرقم غير موجود في قاعدة بياناتنا.</p>";
            }
        } catch (error) {
            resultDiv.innerHTML = "<p class='error-text'>حدث خطأ في الاتصال، تأكد من الأنترنت.</p>";
        }
    }
</script>

</body>
</html>
