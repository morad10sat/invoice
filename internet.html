<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moradsat - Gestion Internet</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; direction: rtl; text-align: center; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #1a2a6c; }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #1a2a6c; color: white; cursor: pointer; border: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #1a2a6c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Moradsat Internet</h1>
    <div id="admin-section">
        <input type="text" id="clientName" placeholder="إسم الزبون">
        <input type="date" id="expiryDate">
        <button onclick="addClient()">إضافة زبون</button>
    </div>
    <hr>
    <table>
        <thead>
            <tr>
                <th>الزبون</th>
                <th>تاريخ الانتهاء</th>
            </tr>
        </thead>
        <tbody id="clientsTable"></tbody>
    </table>
</div>

<script>
    // هاد الجزء هو اللي فيه معلومات Firebase ديالك
    const firebaseConfig = {
        apiKey: "AIzaSyAqnOGOVPEAJ0kx-yxjAbua...", 
        authDomain: "moradsat-db.firebaseapp.com",
        databaseURL: "https://moradsat-db-default-rtdb.firebaseio.com",
        projectId: "moradsat-db",
        storageBucket: "moradsat-db.appspot.com",
        messagingSenderId: "621440703659",
        appId: "1:621440703659:web:9f5e9b7843d883091b6bee"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addClient() {
        const name = document.getElementById('clientName').value;
        const date = document.getElementById('expiryDate').value;
        if(name && date) {
            db.ref('clients').push({ name: name, date: date });
            alert("تمت الإضافة بنجاح");
        }
    }

    db.ref('clients').on('value', (snapshot) => {
        const table = document.getElementById('clientsTable');
        table.innerHTML = "";
        snapshot.forEach((child) => {
            let row = `<tr><td>${child.val().name}</td><td>${child.val().date}</td></tr>`;
            table.innerHTML += row;
        });
    });
</script>

</body>
</html>
